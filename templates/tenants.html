{{define "body"}}
<div class="col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2 main">
    <h1 class="page-header">Tenants</h1>
    <div id="flashes" class="row"></div>
    <p>Tenants are the clients you host Gophish for. Each tenant has its own teams and users, fully isolated from
        every other tenant. As a provider admin you manage them all here.</p>
    <div class="row">
        <button type="button" class="btn btn-primary" id="new_button"><i class="fa fa-plus"></i> New Tenant</button>
    </div>
    &nbsp;
    <div id="loading">
        <i class="fa fa-spinner fa-spin fa-4x"></i>
    </div>
    <div class="row">
        <table id="tenantTable" class="table" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Created</th>
                    <th class="col-md-3 no-sort"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Tenant create/rename modal -->
<div class="modal fade" id="modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="tenantModalLabel">New Tenant</h4>
            </div>
            <div class="modal-body">
                <div class="row" id="modal.flashes"></div>
                <label class="control-label" for="name">Name:</label>
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Tenant name" id="name" autofocus />
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modalSubmit">Save</button>
            </div>
        </div>
    </div>
</div>
{{end}} {{define "scripts"}}
<script src="/js/dist/app/tenants.min.js"></script>
{{end}}
