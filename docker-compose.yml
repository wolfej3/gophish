# Sample docker-compose stack for the hardened gophish fork: the admin and
# phishing servers backed by MySQL. Copy .env.example to .env and edit the
# secrets before running:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Then open https://localhost:3333 (accept the self-signed certificate) and log
# in as "admin" with GOPHISH_INITIAL_ADMIN_PASSWORD from your .env.
#
# For real (non-self-signed) TLS via a reverse proxy, add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build

services:
  db:
    image: mysql:8.4.6
    restart: unless-stopped
    # Gophish stores zero dates, which MySQL's default strict mode rejects, so
    # drop NO_ZERO_DATE / NO_ZERO_IN_DATE from sql_mode.
    command: --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_DATABASE: gophish
      MYSQL_USER: gophish
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  gophish:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Point gophish at the MySQL service. db/run.sh maps these into config.json.
      DB_NAME: mysql
      DB_FILE_PATH: "gophish:${MYSQL_PASSWORD}@(db:3306)/gophish?charset=utf8&parseTime=True&loc=UTC"
      # Admin server: built-in self-signed TLS on :3333.
      ADMIN_LISTEN_URL: 0.0.0.0:3333
      ADMIN_USE_TLS: "true"
      # Phishing server on :80 (published as 8080 below).
      PHISH_LISTEN_URL: 0.0.0.0:80
      PHISH_USE_TLS: "false"
      # First-run admin password, so you don't have to scrape it from the logs.
      GOPHISH_INITIAL_ADMIN_PASSWORD: ${GOPHISH_INITIAL_ADMIN_PASSWORD:?set GOPHISH_INITIAL_ADMIN_PASSWORD in .env}
      # If you put gophish behind a proxy or reach it by hostname, set these:
      # ADMIN_TRUSTED_PROXIES: "172.16.0.0/12"
      # ADMIN_TRUSTED_ORIGINS: "gophish.example.com"
    ports:
      - "3333:3333"  # admin interface  -> https://localhost:3333
      - "8080:80"    # phishing server  -> http://localhost:8080
    # No volume is mounted for gophish itself: all persistent data lives in
    # MySQL (the db_data volume). The admin server's self-signed certificate is
    # regenerated when the container is rebuilt; for a stable certificate use
    # the reverse-proxy overlay (docker-compose.proxy.yml) or mount your own.

volumes:
  db_data:
