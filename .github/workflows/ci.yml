name: CI
on:
  - pull_request
  - push
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goVer: ['1.26.10']

    steps:
    - name: Set up Go ${{ matrix.goVer }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.goVer }}
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build -v .
    
    - name: Format
      run: diff -u <(echo -n) <(gofmt -d .)
    
    - name: Test
      run: go test ./...

  mysql:
    name: Test (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: gophish-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pgophish-test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.10'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Get dependencies
      run: go mod download

    # Gophish requires zero dates to be allowed, so we remove NO_ZERO_DATE
    # and NO_ZERO_IN_DATE from MySQL's default sql_mode.
    - name: Configure sql_mode
      run: >-
        mysql -h 127.0.0.1 -uroot -pgophish-test -e
        "SET GLOBAL sql_mode='ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'"

    # Every package shares the one test database, so they must run one at a
    # time (-p 1).
    - name: Test
      env:
        GOPHISH_TEST_MYSQL_DSN: root:gophish-test@(127.0.0.1:3306)/gophish_test?charset=utf8&parseTime=True&loc=UTC
      run: go test -p 1 ./...
